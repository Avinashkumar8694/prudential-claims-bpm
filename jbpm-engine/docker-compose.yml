services:
  postgres:
    image: postgres:16-alpine
    container_name: jbpm-engine-postgres
    environment:
      POSTGRES_USER: jbpm
      POSTGRES_PASSWORD: jbpm
      POSTGRES_DB: jbpm
    ports:
      # 5433, not 5432 — avoids colliding with any Postgres already running natively on the host.
      - "5433:5432"
    volumes:
      - jbpm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jbpm -d jbpm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jbpm-postgres-data:
