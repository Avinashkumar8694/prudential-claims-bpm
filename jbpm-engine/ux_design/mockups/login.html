<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Login — Mockup</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<div class="mockup-label">KEEP, restyled — Login</div>
<div class="login-wrap">

    <h1 style="margin-bottom:4px;">jBPM Engine</h1>

      <div>
        <label class="muted" style="font-size:11.5px; font-weight:600;">Username</label>
        <input style="width:100%; margin-top:4px;" value="avinash" />
      </div>
      <div>
        <label class="muted" style="font-size:11.5px; font-weight:600;">Password</label>
        <input type="password" style="width:100%; margin-top:4px;" value="••••••••" />
      </div>
      <a class="btn primary" style="width:100%; justify-content:center; padding:10px; margin-top:6px;" href="home-dashboard.html">Sign in</a>
    </div>
    <p class="muted" style="font-size:11.5px; margin-top:20px;">jBPM Engine · Node-native BPM console</p>
  </div>
</div>

</html>
